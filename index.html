<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLUE-RED</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1e3a8a">
<style>
:root{--bg:#faf7f2;--sf:#fff;--tx:#1d2330;--mu:#6b7280;--bl:#1e3a8a;--rd:#b91c1c;--bd:#e5e0d6;--kc:44px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--sf:#1b202b;--tx:#eceae4;--mu:#9aa1b0;--bl:#6b8cff;--rd:#f26b6b;--bd:#2c3342}}
:root[data-theme="dark"]{--bg:#12151c;--sf:#1b202b;--tx:#eceae4;--mu:#9aa1b0;--bl:#6b8cff;--rd:#f26b6b;--bd:#2c3342}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:14px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:12px;min-height:52px}
nav button.on{color:var(--bl);font-weight:700;box-shadow:inset 0 3px var(--rd)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.p{background:var(--bl);color:#fff;border-color:var(--bl)}.btn.r{background:var(--rd);color:#fff;border-color:var(--rd)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
input,textarea,select{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:42vh;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
h2{margin:4px 0 10px;font-size:20px}small,.mu{color:var(--mu)}
.big{font-size:64px;font-weight:700;text-align:center;color:var(--bl);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{min-height:54px;font-size:20px;border-radius:12px;border:1px solid var(--bd);background:var(--sf)}
.grid .op{color:var(--rd);font-weight:700}.grid .eq{background:var(--rd);color:#fff}
#disp{font-size:34px;text-align:right;min-height:48px;word-break:break-all}
.kb{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:30vh;overflow:auto}
.kb button{min-width:var(--kc);height:var(--kc);border-radius:8px;border:1px solid var(--bd);background:var(--sf);font-size:18px}
.tk{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--rd);margin:2px}
.gp{display:inline-flex;flex-wrap:wrap;width:104px;border:2px solid var(--bl);border-radius:8px;padding:3px;margin:4px;vertical-align:top}
.rem{text-align:center;padding:30px 10px;border-radius:18px;background:linear-gradient(160deg,#0f1e4d,#3a1230);color:#f5efe6}
.rem .t{font-size:34px;font-weight:300;letter-spacing:1px}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){button{transition:transform .08s}button:active{transform:scale(.96)}}
</style></head><body>

<script>
"use strict";
var KEY="blue-red-v1",D;
function uid(){return Math.random().toString(36).slice(2,10)}
function def(){return{v:1,notes:[],cur:null,hist:[],counters:[{id:uid(),n:"Counter",v:0,step:1,log:[]}],board:{n:"Board",unit:1,group:10,count:0},rem:[],set:{theme:"auto",bl:"",rd:"",kc:44,mode:"comfortable"}}}
function load(){try{var s=localStorage.getItem(KEY);D=s?JSON.parse(s):def()}catch(e){D=def()}}
var okSave=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(D));okSave=true}catch(e){okSave=false;var b=document.getElementById("sv");if(b)b.textContent="Save failed – storage full"}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applySet(){var r=document.documentElement,s=D.set;if(s.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",s.theme);
["bl","rd"].forEach(function(k){if(s[k])r.style.setProperty("--"+k,s[k]);else r.style.removeProperty("--"+k)});r.style.setProperty("--kc",s.kc+"px")}
var tabs=[["nb","Notebook"],["ca","Calc"],["ta","Tally"],["to","Tokens"],["re","Remember"],["st","Studio"]],tab="nb",tick=null;
function nav(){$("#nv").innerHTML=tabs.map(function(t){return'<button class="'+(t[0]===tab?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
document.querySelectorAll("#nv button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;go()}})}
function go(){clearInterval(tick);nav();({nb:nb,ca:ca,ta:ta,to:to,re:re,st:st})[tab]()}
/* NOTEBOOK */
var q="",kbOn=false,lay="ne";
var NE={"Vowels":"अ आ इ ई उ ऊ ऋ ए ऐ ओ औ अं अः","Consonants":"क ख ग घ ङ च छ ज झ ञ ट ठ ड ढ ण त थ द ध न प फ ब भ म य र ल व श ष स ह","Signs":"ा ि ी ु ू ृ े ै ो ौ ं ः ँ ् ।","Conjuncts":"क्ष त्र ज्ञ श्र","Digits":"० १ २ ३ ४ ५ ६ ७ ८ ९"};
function note(){return D.notes.find(function(n){return n.id===D.cur})}
function wc(s){var m=s.trim().match(/\S+/g);return m?m.length:0}
function nb(){var n=note(),v=$("#v");
if(!n){var list=D.notes.filter(function(x){var t=(x.t+" "+x.b).toLowerCase();return !q||t.indexOf(q.toLowerCase())>=0}).sort(function(a,b){return (b.pin-a.pin)||b.ts-a.ts});
v.innerHTML='<h2>Notebook</h2><div class="row"><input id="q" placeholder="Search notes" value="'+esc(q)+'"><button class="btn p" id="new" style="flex:0 0 auto">+ New note</button></div>'+
(list.length?list.map(function(x){return'<div class="card" data-id="'+x.id+'"><b>'+(x.pin?"📌 ":"")+esc(x.t||"Untitled")+'</b><br><small>'+esc(x.b.slice(0,80))+'</small></div>'}).join(""):'<p class="mu">Welcome. Tap “New note” and start writing. Everything stays on this device.</p>');
$("#q").oninput=function(){q=this.value;nb();var e=$("#q");e.focus();e.setSelectionRange(q.length,q.length)};
$("#new").onclick=function(){var x={id:uid(),t:"",b:"",pin:0,ts:Date.now()};D.notes.push(x);D.cur=x.id;save();nb()};
document.querySelectorAll("[data-id]").forEach(function(c){c.onclick=function(){D.cur=c.dataset.id;nb()}});return}
v.innerHTML='<div class="row"><button class="btn" id="bk" style="flex:0 0 auto">← Notes</button><button class="btn" id="pn" style="flex:0 0 auto">'+(n.pin?"Unpin":"Pin")+'</button><button class="btn" id="ex" style="flex:0 0 auto">Copy</button><button class="btn" id="kb" style="flex:0 0 auto">ने Keys</button><button class="btn" id="dl" style="flex:0 0 auto">Delete</button></div>'+
'<input id="ti" placeholder="Title" value="'+esc(n.t)+'" style="margin:8px 0;font-weight:700"><textarea id="bd" placeholder="Write here…">'+esc(n.b)+'</textarea>'+
'<small id="sv"></small> <small id="st"></small><div id="kbd" class="kb '+(kbOn?"":"hide")+'"></div>';
var ta=$("#bd"),ti=$("#ti"),h;
function info(){var w=wc(ta.value);$("#st").textContent=w+" words · "+ta.value.length+" chars · ~"+Math.max(1,Math.ceil(w/220))+" min read"}
function upd(){n.t=ti.value;n.b=ta.value;n.ts=Date.now();clearTimeout(h);h=setTimeout(function(){save();var s=$("#sv");if(s&&okSave)s.textContent="Saved"},300);info()}
ta.oninput=upd;ti.oninput=upd;info();
function drawKb(){var k=$("#kbd"),h="";Object.keys(NE).forEach(function(g){NE[g].split(" ").forEach(function(c){h+='<button data-c="'+c+'">'+c+'</button>'})});
h+='<button data-c=" " style="min-width:120px">space</button><button data-c="\n">⏎</button><button data-c="BK">⌫</button>';k.innerHTML=h;
k.querySelectorAll("button").forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){ta.focus();var c=b.dataset.c,s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
if(c==="BK"){if(s!==e){ta.value=v.slice(0,s)+v.slice(e);ta.setSelectionRange(s,s)}else if(s>0){var cut=Array.from(v.slice(0,s));cut.pop();var nv=cut.join("");ta.value=nv+v.slice(s);ta.setSelectionRange(nv.length,nv.length)}}
else{ta.value=v.slice(0,s)+c+v.slice(e);ta.setSelectionRange(s+c.length,s+c.length)}upd()}})}
drawKb();
$("#bk").onclick=function(){if(!n.t&&!n.b)D.notes=D.notes.filter(function(x){return x!==n});D.cur=null;save();nb()};
$("#pn").onclick=function(){n.pin=n.pin?0:1;save();nb()};
$("#kb").onclick=function(){kbOn=!kbOn;$("#kbd").classList.toggle("hide",!kbOn)};
$("#ex").onclick=function(){var t=(n.t?n.t+"\n\n":"")+n.b;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$("#sv").textContent="Copied as text"},function(){ta.select();$("#sv").textContent="Select and copy manually"})};
$("#dl").onclick=function(){if(confirm("Delete this note? This cannot be undone.")){D.notes=D.notes.filter(function(x){return x!==n});D.cur=null;save();nb()}}}
/* CALC */
var ex="";
function evalX(s){var p=0,t=s.replace(/\s/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
function pk(){return t[p]}
function num(){var m=/^\d*\.?\d+/.exec(t.slice(p));if(!m)throw 0;p+=m[0].length;return parseFloat(m[0])}
function fac(){var v;if(pk()==="-"){p++;return -pw()}if(pk()==="+"){p++;return pw()}return pw()}
function pw(){var b=at();while(pk()==="^"){p++;b=Math.pow(b,fac())}return b}
function at(){var v;if(pk()==="("){p++;v=ex2();if(pk()!==")")throw 0;p++}else if(t.slice(p,p+2)==="√("||t.slice(p,p+1)==="√"){p++;var a=pk()==="("?(p++,ex2()):num();if(t[p-1]!==")"&&false)throw 0;if(t[p]===")"&&t[p-1]!=="(")p++;v=Math.sqrt(a)}else v=num();while(pk()==="%"){p++;v=v/100}return v}
function tm(){var v=fac();while(pk()==="*"||pk()==="/"){var o=t[p++],r=fac();if(o==="/"&&r===0)throw "÷0";v=o==="*"?v*r:v/r}return v}
function ex2(){var v=tm();while(pk()==="+"||pk()==="-"){var o=t[p++],r=tm();v=o==="+"?v+r:v-r}return v}
var r=ex2();if(p!==t.length)throw 0;if(!isFinite(r))throw "Too large";return r}
function ca(){var v=$("#v");
var keys=["C","⌫","(",")","7","8","9","÷","4","5","6","×","1","2","3","−","0",".","%","+","√","^","ANS","="];
v.innerHTML='<h2>Calculator</h2><div class="card"><div class="mu" id="pv" style="text-align:right;min-height:22px"></div><div id="disp">'+esc(ex||"0")+'</div></div><div class="grid" id="g">'+keys.map(function(k){return'<button class="'+("÷×−+^√".indexOf(k)>=0?"op":k==="="?"eq":"")+'" data-k="'+k+'">'+k+'</button>'}).join("")+'</div>'+
'<h2 style="margin-top:18px">History</h2><div id="hs"></div><button class="btn" id="ch">Clear history</button>';
function hist(){$("#hs").innerHTML=D.hist.length?D.hist.slice().reverse().map(function(h,i){return'<div class="card" data-r="'+h.r+'"><span class="mu">'+esc(h.e)+'</span> = <b>'+h.r+'</b></div>'}).join(""):'<p class="mu">No calculations yet.</p>';
document.querySelectorAll("[data-r]").forEach(function(c){c.onclick=function(){ex+=c.dataset.r;draw()}})}
function draw(){$("#disp").textContent=ex||"0";try{if(ex&&/[\d)]$/.test(ex))$("#pv").textContent="= "+fmt(evalX(ex));else $("#pv").textContent=""}catch(e){$("#pv").textContent=""}}
function fmt(n){return String(parseFloat(n.toPrecision(12)))}
$("#g").onclick=function(e){var k=e.target.dataset.k;if(!k)return;
if(k==="C")ex="";else if(k==="⌫")ex=ex.slice(0,-1);else if(k==="ANS"){if(D.hist.length)ex+=D.hist[D.hist.length-1].r}
else if(k==="="){try{var r=fmt(evalX(ex));D.hist.push({e:ex,r:r});if(D.hist.length>200)D.hist.shift();ex=r;save();hist()}catch(x){$("#pv").textContent=typeof x==="string"?x:"Invalid expression";return}}
else ex+=k;draw()};
$("#ch").onclick=function(){if(confirm("Clear calculation history?")){D.hist=[];save();hist()}};hist();draw()}
/* TALLY */
function ta(){var v=$("#v");
v.innerHTML='<h2>Tally</h2>'+D.counters.map(function(c){return'<div class="card" data-c="'+c.id+'"><div class="row"><input class="nm" value="'+esc(c.n)+'" aria-label="Counter name"><input class="stp" type="number" min="1" value="'+c.step+'" style="max-width:70px" aria-label="Step"></div><div class="big">'+c.v+'</div><div class="row"><button class="btn" data-a="-">− '+c.step+'</button><button class="btn p" data-a="+" style="flex:3;min-height:72px;font-size:28px">+ '+c.step+'</button></div><div class="row" style="margin-top:8px"><button class="btn" data-a="u">Undo</button><button class="btn" data-a="r">Reset</button><button class="btn" data-a="d">Remove</button></div></div>'}).join("")+'<button class="btn p" id="add">+ New counter</button>';
$("#add").onclick=function(){D.counters.push({id:uid(),n:"Counter "+(D.counters.length+1),v:0,step:1,log:[]});save();ta()};
document.querySelectorAll("[data-c]").forEach(function(el){var c=D.counters.find(function(x){return x.id===el.dataset.c});
el.querySelector(".nm").oninput=function(){c.n=this.value;save()};el.querySelector(".stp").onchange=function(){c.step=Math.max(1,parseInt(this.value)||1);save();ta()};
el.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var a=b.dataset.a;
if(a==="+"||a==="-"){var d=a==="+"?c.step:-c.step;c.v+=d;c.log.push(d);if(c.log.length>500)c.log.shift();if(navigator.vibrate)navigator.vibrate(8)}
else if(a==="u"){var l=c.log.pop();if(l)c.v-=l}
else if(a==="r"){if(c.v!==0&&confirm("Reset this counter to 0?")){c.v=0;c.log=[]}}
else if(a==="d"){if(confirm("Remove this counter?"))D.counters=D.counters.filter(function(x){return x!==c})}
save();ta()}})})}
/* TOKENS */
function to(){var b=D.board,v=$("#v");
function draw(){var g=Math.floor(b.count/b.group),r=b.count%b.group,h="";
for(var i=0;i<Math.min(g,60);i++){h+='<span class="gp" title="group of '+b.group+'">'+'<span class="tk"></span>'.repeat(Math.min(b.group,50))+'</span>'}
if(g>60)h+='<p class="mu">…and '+(g-60)+' more groups</p>';
h+='<div>'+'<span class="tk" style="background:var(--bl)"></span>'.repeat(r)+'</div>';
$("#tk").innerHTML=h;$("#tot").textContent=b.count*b.unit;$("#sum").textContent=b.count+" tokens = "+g+" group"+(g===1?"":"s")+" of "+b.group+(r?" + "+r:"")}
v.innerHTML='<h2>Token Board</h2><div class="card"><div class="row"><label>Each token =<input id="un" type="number" min="1" value="'+b.unit+'"></label><label>Group size<select id="gs">'+[5,10,20].map(function(n){return'<option'+(b.group===n?" selected":"")+'>'+n+'</option>'}).join("")+'</select></label></div></div><div class="big" id="tot"></div><p class="mu" id="sum" style="text-align:center"></p><div class="row"><button class="btn" id="m">− Remove</button><button class="btn p" id="p" style="flex:3;min-height:64px">+ Add token</button></div><div class="card" id="tk"></div><button class="btn" id="rs">Reset board</button>';
$("#p").onclick=function(){b.count++;save();draw()};$("#m").onclick=function(){if(b.count>0)b.count--;save();draw()};
$("#un").onchange=function(){b.unit=Math.max(1,parseInt(this.value)||1);save();draw()};$("#gs").onchange=function(){b.group=parseInt(this.value);save();draw()};
$("#rs").onclick=function(){if(confirm("Reset the board to 0?")){b.count=0;save();draw()}};draw()}
/* REMEMBRANCE */
function el(s){var ms=s.acc+(s.run?Date.now()-s.start:0);ms=Math.max(0,ms);var t=Math.floor(ms/1000);return[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60]}
function re(){var v=$("#v");
v.innerHTML='<h2>Remembrance</h2><p class="mu">A quiet place to count time from a moment you choose.</p>'+D.rem.map(function(s){return'<div class="rem" data-s="'+s.id+'"><div>'+esc(s.name)+'</div><div class="t"></div><small>since '+new Date(s.created).toLocaleString()+'</small><div class="row" style="margin:12px 0"><button class="btn" data-a="p">'+(s.run?"Pause":"Resume")+'</button><button class="btn" data-a="r">Reset</button><button class="btn" data-a="d">Remove</button></div><textarea placeholder="Private reflection (optional)" style="min-height:70px">'+esc(s.note||"")+'</textarea></div>'}).join("")+
'<div class="card"><input id="rn" placeholder="Name this moment"><button class="btn p" id="ra" style="margin-top:8px;width:100%">Begin counting from now</button></div>';
$("#ra").onclick=function(){D.rem.push({id:uid(),name:$("#rn").value||"Untitled",created:Date.now(),start:Date.now(),acc:0,run:true,note:""});save();re()};
document.querySelectorAll("[data-s]").forEach(function(e){var s=D.rem.find(function(x){return x.id===e.dataset.s});
e.querySelector("textarea").oninput=function(){s.note=this.value;save()};
e.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var a=b.dataset.a;
if(a==="p"){if(s.run){s.acc+=Date.now()-s.start;s.run=false}else{s.start=Date.now();s.run=true}}
else if(a==="r"){if(confirm("Reset this session to zero?")){s.acc=0;s.start=Date.now();s.created=Date.now()}}
else if(a==="d"){if(confirm("Remove this session?"))D.rem=D.rem.filter(function(x){return x!==s})}
save();re()}})});
function paint(){document.querySelectorAll("[data-s]").forEach(function(e){var s=D.rem.find(function(x){return x.id===e.dataset.s}),t=el(s);e.querySelector(".t").textContent=t[0]+"d "+t[1]+"h "+t[2]+"m "+t[3]+"s"})}
paint();tick=setInterval(paint,1000)}
/* STUDIO */
function st(){var s=D.set,v=$("#v");
v.innerHTML='<h2>Studio</h2><div class="card"><b>Theme</b><select id="th"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select>'+
'<div class="row" style="margin-top:10px"><label>Blue<input type="color" id="cb" value="'+(s.bl||"#1e3a8a")+'"></label><label>Red<input type="color" id="cr" value="'+(s.rd||"#b91c1c")+'"></label></div>'+
'<label class="mu">Keyboard key size: <span id="kv">'+s.kc+'</span>px<input type="range" id="kc" min="34" max="64" value="'+s.kc+'"></label><button class="btn" id="rst" style="margin-top:8px">Restore default look</button></div>'+
'<div class="card"><b>Backup &amp; restore</b><p class="mu">Copy your whole library as JSON, or paste a backup below to restore it.</p><textarea id="bk" style="min-height:90px"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="be">Show backup</button><button class="btn r" id="bi">Restore</button></div><small id="bm"></small></div>'+
'<p class="mu">Data is stored only in this browser. Clearing site data erases it, so back up regularly.</p>';
$("#th").value=s.theme;$("#th").onchange=function(){s.theme=this.value;save();applySet()};
$("#cb").oninput=function(){s.bl=this.value;save();applySet()};$("#cr").oninput=function(){s.rd=this.value;save();applySet()};
$("#kc").oninput=function(){s.kc=+this.value;$("#kv").textContent=this.value;save();applySet()};
$("#rst").onclick=function(){s.bl="";s.rd="";s.kc=44;s.theme="auto";save();applySet();st()};
$("#be").onclick=function(){$("#bk").value=JSON.stringify(D)};
$("#bi").onclick=function(){try{var x=JSON.parse($("#bk").value);if(!x||x.v!==1||!Array.isArray(x.notes)||!Array.isArray(x.counters)||!x.board||!Array.isArray(x.rem)||!x.set)throw 0;
if(!confirm("Restoring replaces all current data. Continue?"))return;D=x;D.cur=null;save();applySet();$("#bm").textContent="Restored."}catch(e){$("#bm").textContent="That backup is not valid. Nothing was changed."}}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
load();applySet();go();
</script></body></html>
